name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            viewer/package-lock.json

      - name: Cache Wasm build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/wasm/target
          key: ${{ runner.os }}-viewer-wasm-rust-1.97.1-${{ hashFiles('Cargo.lock', 'bindings/wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-viewer-wasm-rust-1.97.1-

      - name: Cache wasm-bindgen CLI 0.2.127
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127

      - name: Install wasm-bindgen CLI 0.2.127
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi

      - name: Install website and viewer dependencies
        run: |
          npm ci --prefix site
          npm ci --prefix viewer

      - name: Assemble the Pages site
        working-directory: site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
