[workspace]

[package]
name = "marksheet-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mattsoldo/marksheet"
description = "Worker-oriented WebAssembly bindings for Marksheet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
marksheet-calc = { path = "../../crates/marksheet-calc" }
marksheet-edit = { path = "../../crates/marksheet-edit" }
marksheet-extensions = { path = "../../crates/marksheet-extensions" }
marksheet-model = { path = "../../crates/marksheet-model" }
marksheet-syntax = { path = "../../crates/marksheet-syntax" }
marksheet-view = { path = "../../crates/marksheet-view" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
